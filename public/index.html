<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Theater</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="hero">
    <h1>Agent Theater</h1>
    <p>에이전트와 하위 에이전트의 협업 과정을 실시간으로 관찰합니다.</p>
  </header>

  <main class="grid">
    <section class="panel controls">
      <h2>실행</h2>
      <form id="runForm">
        <label for="goal">목표</label>
        <textarea id="goal" rows="3" placeholder="예: 경쟁사 분석 보고서를 3개 에이전트로 작성"></textarea>
        <button type="submit">런 시작</button>
      </form>
      <div class="statusRow">
        <span>연결 상태</span>
        <strong id="connStatus">연결 중...</strong>
      </div>
      <div class="statusRow">
        <span>마지막 이벤트 ID</span>
        <strong id="lastEvent">0</strong>
      </div>
      <div class="statusRow">
        <span>모델</span>
        <strong id="modelName">-</strong>
      </div>
      <div class="statusRow">
        <span>API 키</span>
        <strong id="keyState">-</strong>
      </div>
      <div class="statusBlock">
        <span>활성 도구</span>
        <code id="toolList">-</code>
      </div>
      <div class="statusBlock">
        <span>외부 연동</span>
        <code id="integrationList">-</code>
      </div>
      <p class="note">참고: 내부 비공개 추론 원문 대신, 계획/근거/툴 호출/검증 로그를 노출합니다.</p>
    </section>

    <section class="panel tree">
      <h2>에이전트 트리</h2>
      <ul id="agentTree"></ul>
    </section>

    <section class="panel stream">
      <h2>실시간 대화</h2>
      <div id="timeline" class="timeline"></div>
    </section>

    <section class="panel events">
      <h2>이벤트 로그</h2>
      <div id="events" class="eventsList"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
